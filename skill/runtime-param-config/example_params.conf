# Runtime parameters. Commented values are defaults applied when a key is absent.
# Format: KEY=VALUE, one per line, no spaces around '='.

# ---- arm kinematics -------------------------------------------------
BASE_H=112
LINK1=200
LINK2=175
TOOL_X=35
TOOL_Z=35

# ---- placement ------------------------------------------------------
# Radius from the base centre to the drop point, in mm.
PLACE_R=200
# Height at which the gripper opens, in mm (lower when the box is low).
PLACE_Z=90

# ---- motion ---------------------------------------------------------
# Inter-frame delay for the stepper driver, in ms.
# Do not lower this without re-running the gap sweep (see zdt-driver-timing).
GAP_MS=60

# ---- gripper --------------------------------------------------------
# Servo pulse widths in microseconds.
GRIP_CLOSE_US=530
GRIP_OPEN_US=1150
